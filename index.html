<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupo de Pokémon</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="party-window">
        <div class="top-border"></div>
        
        <div class="header">
            <div class="header-title">
                <i class="fa-solid fa-users title-icon"></i>
                <span>Grupo de Pokémon</span>
            </div>
            <i class="fa-solid fa-xmark close-icon"></i>
        </div>
        
        <div class="separator-container">
            <div class="separator"></div>
        </div>
        
        <div class="button-row">
            <button class="action-btn">Criar Grupo Privado</button>
            <button class="action-btn" onclick="window.location.href='team_finder.html'">Abrir Grupos Públicos</button>
        </div>
        
        <div class="subtitle">Convites</div>
        
        <div class="separator-container">
            <div class="separator"></div>
        </div>
        
        <div class="empty-state">
            <span class="empty-text">Nenhum convite</span>
            <img src="assets/images_ui/no_invites.png" alt="Psyduck chorando" class="empty-img" onerror="this.style.display='none'">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
