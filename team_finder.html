<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Equipe - Party Finder</title>
    <link rel="stylesheet" href="team_finder.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="tf-window">
        <!-- Barra de Status Superior do Cliente (Visual) -->
        <div class="top-border"></div>

        <!-- Cabeçalho Principal -->
        <div class="header">
            <div class="header-title">
                <i class="fa-solid fa-users-viewfinder title-icon"></i>
                <span>Buscar Equipe</span>
            </div>
            <i class="fa-solid fa-xmark close-icon" onclick="window.location.href='index.html'"></i>
        </div>

        <div class="separator-container">
            <div class="separator"></div>
        </div>

        <!-- Barra de Ferramentas (Filtros e Busca) -->
        <div class="toolbar">
            <div class="toolbar-left">
                <div class="custom-select">
                    <select id="filterType">
                        <option value="all">Todas as Categorias</option>
                        <option value="quests">Quests / Aventuras</option>
                        <option value="pve">PvE / Hunts</option>

                    </select>
                    <i class="fa-solid fa-chevron-down select-icon"></i>
                </div>
            </div>

            <div class="toolbar-right">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" placeholder="Buscar líder, pokémon, tags..">
                </div>
                <button class="action-btn highlight-btn" id="createTeamBtn">
                    Criar Grupo
                </button>
            </div>
        </div>

        <!-- Lista de Equipes -->
        <div class="team-list-container">
            <div class="list-header">
                <div>Conteúdo</div>
                <div>Líder do Grupo</div>
                <div style="text-align: center;">Requisitos</div>
                <div style="text-align: center;">Composição</div>
                <div style="text-align: right; padding-right: 20px;">Ação</div>
            </div>

            <div id="teamList">
                <!-- Equipes injetadas via JavaScript -->
            </div>
        </div>
    </div>

    <!-- Modal: Criar Equipe -->
    <div class="modal-overlay" id="createModal">
        <div class="modal-window">
            <div class="header">
                <div class="header-title">
                    <span>Criar Grupo</span>
                </div>
                <i class="fa-solid fa-xmark close-icon"></i>
            </div>

            <div class="separator-container">
                <div class="separator"></div>
            </div>

            <div class="modal-body">
                <div style="display: flex; flex-direction: column; gap: 20px; padding: 10px 10px 20px 10px;">
                    <!-- 1. Configurações (Conteúdo e Nível) -->
                    <div style="display: grid; grid-template-columns: 1fr 100px 100px; gap: 15px;">
                        <div class="form-group">
                            <label class="modal-section-label">Conteúdo do Grupo</label>
                            <div class="custom-select" style="width: 100%;">
                                <select id="createContent"
                                    style="width: 100%; background: #080808; border: 1px solid #222; color: #fff; padding: 10px 35px 10px 15px; border-radius: 6px; outline: none; appearance: none; font-family: inherit;">
                                    <!-- Injetado via JS -->
                                </select>
                                <i class="fa-solid fa-chevron-down select-icon" style="right: 15px;"></i>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="modal-section-label">Lvl Min</label>
                            <input type="number" id="createReqLvl" value="400"
                                style="width: 100%; background: #080808; border: 1px solid #222; color: #fff; padding: 10px; border-radius: 6px;">
                        </div>

                        <div class="form-group">
                            <label class="modal-section-label">Vagas</label>
                            <input type="number" id="createMaxPlayers" value="4" min="1" max="10"
                                style="width: 100%; background: #080808; border: 1px solid #222; color: #fff; padding: 10px; border-radius: 6px;">
                        </div>
                    </div>

                    <!-- 2. Suas Funções / Pokémons -->
                    <div style="border-top: 1px solid #1a1a1a; padding-top: 15px;">
                        <label class="modal-section-label">Suas Funções / Pokémons</label>
                        <div id="creationRolesList" style="display: flex; flex-direction: column; gap: 10px;">
                            <!-- Dynamic role slots for creator -->
                        </div>
                        <button type="button" class="action-btn" onclick="addDynamicRoleRow()"
                            style="width: 100%; margin-top: 10px; justify-content: center; background: rgba(37, 99, 235, 0.1); border: 1px solid #2563eb; color: #fff;">
                            <i class="fa-solid fa-plus"></i> Adicionar Pokémon
                        </button>
                    </div>

                    <!-- 3. Vagas Necessárias -->
                    <div style="border-top: 1px solid #1a1a1a; padding-top: 15px;">
                        <label class="modal-section-label">Vagas Necessárias (Para o Grupo)</label>
                        <div id="neededRoleList"
                            style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px;">
                            <!-- Vagas em aberto aparecem aqui -->
                        </div>
                        <button type="button" class="action-btn" id="addNeededRoleBtn"
                            style="width: 100%; justify-content: center; background: rgba(255,255,255,0.05); border: 1px dashed #444; border-radius: 8px;">
                            <i class="fa-solid fa-plus"></i> Adicionar Vaga em Aberto
                        </button>
                    </div>

                    <!-- 4. Comentário -->
                    <div class="form-group" style="border-top: 1px solid #1a1a1a; padding-top: 15px;">
                        <label class="modal-section-label">Comentário Adicional</label>
                        <textarea id="createComment" placeholder="Escreva algo aqui..."
                            style="width: 100%; background: #080808; border: 1px solid #222; color: #fff; padding: 10px; border-radius: 6px; height: 60px; resize: none;"></textarea>
                    </div>
                </div>
            </div>

            <div class="separator-container">
                <div class="separator"></div>
            </div>

            <div class="modal-footer" style="padding: 15px 20px; display: flex; justify-content: flex-end; gap: 10px;">
                <button class="action-btn btn-ghost" onclick="closeCreateModal()">Cancelar</button>
                <button class="action-btn highlight-btn" onclick="createGroup()">Anunciar Grupo</button>
            </div>
        </div>
    </div>

    <!-- Modal: Seletor de Pokémon -->
    <div class="modal-overlay" id="pokemonPickerModal" style="z-index: 3000;">
        <div class="modal-window" style="width: 700px; max-height: 80vh; display: flex; flex-direction: column;">
            <div class="header">
                <div class="header-title">
                    <i class="fa-solid fa-paw title-icon"></i>
                    <span>Selecionar Pokémon</span>
                </div>
                <i class="fa-solid fa-xmark close-icon" onclick="closePickerModal()"></i>
            </div>

            <div class="separator-container">
                <div class="separator"></div>
            </div>

            <div class="toolbar" style="padding: 10px 20px; border-bottom: 1px solid #222;">
                <div class="search-box" style="flex: 1;">
                    <i class="fa-solid fa-search search-icon"></i>
                    <input type="text" id="pickerSearch" placeholder="Buscar por nome..." oninput="filterPicker()">
                </div>
                <div class="custom-select" style="width: 200px; margin-left: 10px;">
                    <select id="pickerRoleFilter" onchange="filterPicker()">
                        <option value="all">Todas as Funções</option>
                        <option value="otdd">Over Time Damage Dealer</option>
                        <option value="bdd">Burst Damage Dealer</option>
                        <option value="tank">Tanker</option>
                        <option value="sot">Support Over Time</option>
                    </select>
                    <i class="fa-solid fa-chevron-down select-icon"></i>
                </div>
            </div>

            <div class="modal-body" id="pickerGrid">
                <!-- Injetado via JS -->
            </div>

            <div class="separator-container">
                <div class="separator"></div>
            </div>

            <div class="modal-footer"
                style="padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: #080808;">
                <div id="selectedPokeInfo" style="display: flex; align-items: center; gap: 10px;">
                    <div
                        style="width: 40px; height: 40px; background: #111; border: 1px solid #333; border-radius: 4px; display: flex; align-items: center; justify-content: center;">
                        <img id="selectedPokeImg" src="" style="width: 32px; height: 32px; display: none;">
                    </div>
                    <div style="display: flex; flex-direction: column;">
                        <span id="selectedPokeName" style="color: #eee; font-weight: 500;">Nenhum selecionado</span>
                        <div id="selectedPokeHelds" style="display: flex; gap: 4px; margin-top: 2px;"></div>
                    </div>
                </div>
                <button class="action-btn highlight-btn" id="confirmPokeBtn" onclick="confirmPokemonSelection()"
                    disabled>Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Modal: Candidatura (Apply) -->
    <div class="modal-overlay" id="applyModal">
        <div class="modal-window">
            <div class="header">
                <div class="header-title">
                    <i class="fa-solid fa-paper-plane title-icon"></i>
                    <span>Solicitar Vaga</span>
                </div>
                <i class="fa-solid fa-xmark close-icon" onclick="closeApplyModal()"></i>
            </div>
            <div class="separator-container">
                <div class="separator"></div>
            </div>
            <div class="modal-body" style="padding: 20px; display: flex; flex-direction: column; gap: 20px;">
                <div>
                    <label class="modal-section-label">Escolha sua Função</label>
                    <div id="applyRoleContainer" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <!-- Roles injetadas via JS -->
                    </div>
                </div>
                <div>
                    <label class="modal-section-label">Seu Pokémon</label>
                    <div class="role-row-poke-picker" id="applyPokePicker" onclick="openPickerModal(this)"
                        style="padding: 15px; background: #080808; display: flex; align-items: center; gap: 20px;">
                        <img id="applyPokeIcon" src="assets/images_ui/pokeball_empty.png"
                            style="width:64px; height:64px; object-fit: contain;">
                        <div style="display: flex; flex-direction: column; gap: 5px;">
                            <span id="applyPokeName"
                                style="color: #eee; font-weight: 700; font-size: 1.1rem;">Selecionar Pokémon...</span>
                            <div id="applyPokeHelds" style="display: flex; gap: 8px; margin-top: 2px;"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="separator-container">
                <div class="separator"></div>
            </div>
            <div class="modal-footer" style="padding: 15px 20px; display: flex; justify-content: flex-end; gap: 10px;">
                <button class="action-btn btn-ghost" onclick="closeApplyModal()">Cancelar</button>
                <button class="action-btn highlight-btn" id="sendApplyBtn" onclick="submitApplication()" disabled>Enviar
                    Solicitação</button>
            </div>
        </div>
    </div>

    <!-- Modal: Solicitações Pendentes (Applicants) -->
    <div class="modal-overlay" id="applicantsModal">
        <div class="modal-window" style="width: 900px; height: 650px; display: flex; flex-direction: column;">
            <div class="header">
                <div class="header-title">
                    <i class="fa-solid fa-users title-icon"></i>
                    <span>Solicitações Pendentes</span>
                </div>
                <i class="fa-solid fa-xmark close-icon"
                    onclick="document.getElementById('applicantsModal').classList.remove('active')"></i>
            </div>
            <div class="separator-container">
                <div class="separator"></div>
            </div>
            <div class="modal-body"
                style="background: #0b0b0b; padding: 15px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px;">

                <!-- Exemplo de Player 1 (Brock) -->
                <div class="applicant-row-premium">
                    <div style="display: flex; align-items: center; gap: 10px; min-width: 170px;">
                        <img src="assets/clans/orebound.png" style="width:24px; height: 24px;" title="Orebound">
                        <div style="display: flex; flex-direction: column;">
                            <div style="color:#faba4d; font-weight:700; font-size: 1rem;">Brock</div>
                            <div style="color:#666; font-size:0.75rem; font-weight: 500;">Level 550</div>
                        </div>
                    </div>

                    <div style="display: flex; align-items: center; gap: 10px; flex: 1;">
                        <img src="assets/pokemons/105.1.png" style="width:48px; height:48px; object-fit: contain;">
                        <div style="display: flex; flex-direction: column;">
                            <span style="color:#eee; font-weight:600; font-size: 0.95rem;">Shiny Marowak</span>
                            <div style="display: flex; align-items: center; gap: 5px;">
                                <img src="assets/icons/pve_over_time_damage_dealer.png" style="width:16px;">
                                <span
                                    style="font-size: 0.7rem; color: #888; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px;">OTDD</span>
                            </div>
                        </div>
                    </div>

                    <div style="display: flex; gap: 6px; align-items: center; margin-left: 10px;">
                        <div class="large-held-slot"><img src="assets/held item/atk8.png"></div>
                        <div class="large-held-slot"><img src="assets/held item/Ghost.png"></div>
                    </div>

                    <div class="arp-actions"
                        style="display: flex; gap: 15px; align-items: center; border-left: 1px solid #222; padding-left: 20px; margin-left: 10px;">
                        <i class="fa-solid fa-check arp-icon-btn accept" onclick="event.stopPropagation();"></i>
                        <i class="fa-solid fa-xmark arp-icon-btn decline" onclick="event.stopPropagation();"></i>
                    </div>
                </div>

                <!-- Exemplo de Player 3 (Alrik) -->
                <div class="applicant-row-premium">
                    <div style="display: flex; align-items: center; gap: 10px; min-width: 170px;">
                        <img src="assets/clans/psycraft.png" style="width:24px; height: 24px;" title="Psycraft">
                        <div style="display: flex; flex-direction: column;">
                            <div style="color:#faba4d; font-weight:700; font-size: 1rem;">Alrik</div>
                            <div style="color:#666; font-size:0.75rem; font-weight: 500;">Level 520</div>
                        </div>
                    </div>

                    <div style="display: flex; align-items: center; gap: 10px; flex: 1;">
                        <img src="assets/pokemons/901.png" style="width:48px; height:48px; object-fit: contain;">
                        <div style="display: flex; flex-direction: column;">
                            <span style="color:#eee; font-weight:600; font-size: 0.95rem;">Ursaluna</span>
                            <div style="display: flex; align-items: center; gap: 5px;">
                                <img src="assets/icons/pve_over_time_damage_dealer.png" style="width:16px;">
                                <span
                                    style="font-size: 0.7rem; color: #888; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px;">OTDD</span>
                            </div>
                        </div>
                    </div>

                    <div style="display: flex; gap: 6px; align-items: center; margin-left: 10px;">
                        <div class="large-held-slot"><img src="assets/held item/atk8.png"></div>
                        <div class="large-held-slot"><img src="assets/held item/Ghost.png"></div>
                    </div>

                    <div class="arp-actions"
                        style="display: flex; gap: 15px; align-items: center; border-left: 1px solid #222; padding-left: 20px; margin-left: 10px;">
                        <i class="fa-solid fa-check arp-icon-btn accept" onclick="event.stopPropagation();"></i>
                        <i class="fa-solid fa-xmark arp-icon-btn decline" onclick="event.stopPropagation();"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
    </div>

    <!-- Modal: Detalhes do Grupo -->
    <div class="modal-overlay" id="teamDetailsModal">
        <div class="modal-window" style="width: 800px; max-height: 85vh; display: flex; flex-direction: column;">
            <div class="header">
                <div class="header-title">
                    <i class="fa-solid fa-users-viewfinder title-icon"></i>
                    <span id="detailsTeamTitle">Detalhes do Grupo</span>
                </div>
                <i class="fa-solid fa-xmark close-icon" onclick="closeDetailsModal()"></i>
            </div>
            <div class="separator-container">
                <div class="separator"></div>
            </div>
            <div class="modal-body" id="detailsContainer" style="padding: 20px; overflow-y: auto; background: #080808;">
                <!-- Injetado via JS -->
            </div>
        </div>
    </div>

    <script src="team_finder.js"></script>
</body>

</html>
