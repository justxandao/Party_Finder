<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Equipe - Party Finder</title>
    <link rel="stylesheet" href="team_finder.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="tf-window">
        <!-- Barra de Status Superior do Cliente (Visual) -->
        <div class="top-border"></div>

        <!-- Cabeçalho Principal -->
        <div class="header">
            <div class="header-title">
                <i class="fa-solid fa-users-viewfinder title-icon"></i>
                <span>Buscar Equipe</span>
            </div>
            <i class="fa-solid fa-xmark close-icon" onclick="window.location.href='index.html'"></i>
        </div>

        <div class="separator-container">
            <div class="separator"></div>
        </div>

        <!-- Barra de Ferramentas (Filtros e Busca) -->
        <div class="toolbar">
            <div class="toolbar-left">
                <div class="custom-select">
                    <select id="filterType">
                        <option value="all">Todas as Categorias</option>
                        <option value="quests">Quests / Aventuras</option>
                        <option value="pve">PvE / Hunts</option>
                        <option value="pvp">PvP / Torneios</option>
                    </select>
                    <i class="fa-solid fa-chevron-down select-icon"></i>
                </div>
            </div>

            <div class="toolbar-right">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" placeholder="Buscar líder, pokémon, tags..">
                </div>
                <button class="icon-btn" title="Configurações"><i class="fa-solid fa-cog"></i></button>
                <button class="icon-btn" title="Recarregar" onclick="location.reload()"><i class="fa-solid fa-sync-alt"></i></button>
                <button class="action-btn highlight-btn" id="createTeamBtn">
                    <i class="fa-solid fa-plus-circle"></i> Criar um Time
                </button>
            </div>
        </div>

        <!-- Lista de Equipes -->
        <div class="team-list-container">
            <div class="list-header">
                <div>Líder</div>
                <div>Requisitos</div>
                <div>Composição (Funções)</div>
                <div></div> <!-- Ações -->
            </div>

            <div id="teamList">
                <!-- Equipes injetadas via JavaScript -->
            </div>
        </div>
    </div>

    <!-- Modal: Criar Equipe -->
    <div class="modal-overlay" id="createModal">
        <div class="modal-window">
            <div class="header">
                <div class="header-title">
                    <i class="fa-solid fa-plus-circle title-icon"></i>
                    <span>Anunciar Novo Grupo</span>
                </div>
                <i class="fa-solid fa-xmark close-icon"></i>
            </div>

            <div class="separator-container">
                <div class="separator"></div>
            </div>

            <div class="modal-body" style="padding: 20px; display: flex; flex-direction: column; gap: 15px;">
                <div class="form-group">
                    <label class="modal-section-label">Conteúdo do Grupo</label>
                    <div class="custom-select" style="width: 100%;">
                        <select id="createContent" style="width: 100%; background: #080808; border: 1px solid #222; color: #fff; padding: 10px 35px 10px 15px; border-radius: 6px; outline: none; appearance: none; font-family: inherit;">
                            <!-- Injetado via JS -->
                        </select>
                        <i class="fa-solid fa-chevron-down select-icon" style="right: 15px;"></i>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="modal-section-label">Level Mínimo</label>
                    <input type="number" id="createReqLvl" value="400" 
                           style="width: 100%; background: #080808; border: 1px solid #222; color: #fff; padding: 10px; border-radius: 6px;">
                </div>

                <div class="form-group">
                    <label class="modal-section-label">Seu Pokémon & Função</label>
                    <div id="creationRolesList">
                        <!-- Linha dinâmica do líder -->
                    </div>
                </div>

                <div class="form-group">
                    <label class="modal-section-label">Vagas Necessárias</label>
                    <div id="neededRoleList" style="margin-bottom: 10px;">
                        <!-- Vagas adicionais aparecerão aqui -->
                    </div>
                    <button class="action-btn btn-ghost" id="addNeededRoleBtn" style="width: 100%; justify-content: center; border-style: dashed;">
                        <i class="fa-solid fa-plus"></i> Adicionar Vaga de Função
                    </button>
                </div>

                <div class="form-group">
                    <label class="modal-section-label">Comentário Adicional</label>
                    <textarea id="createComment" placeholder="Tragam helds de dano, rush 5x.." 
                              style="width: 100%; background: #080808; border: 1px solid #222; color: #fff; padding: 10px; border-radius: 6px; height: 60px; resize: none;"></textarea>
                </div>
            </div>

            <div class="separator-container">
                <div class="separator"></div>
            </div>

            <div class="modal-footer" style="padding: 15px 20px; display: flex; justify-content: flex-end; gap: 10px;">
                <button class="action-btn btn-ghost" onclick="closeCreateModal()">Cancelar</button>
                <button class="action-btn highlight-btn" onclick="createGroup()">Anunciar Grupo</button>
            </div>
        </div>
    </div>

    <!-- Modal: Seletor de Pokémon -->
    <div class="modal-overlay" id="pokemonPickerModal" style="z-index: 3000;">
        <div class="modal-window" style="width: 700px; max-height: 80vh; display: flex; flex-direction: column;">
            <div class="header">
                <div class="header-title">
                    <i class="fa-solid fa-paw title-icon"></i>
                    <span>Selecionar Pokémon</span>
                </div>
                <i class="fa-solid fa-xmark close-icon" onclick="closePickerModal()"></i>
            </div>

            <div class="separator-container">
                <div class="separator"></div>
            </div>

            <div class="toolbar" style="padding: 10px 20px; border-bottom: 1px solid #222;">
                <div class="search-box" style="flex: 1;">
                    <i class="fa-solid fa-search search-icon"></i>
                    <input type="text" id="pickerSearch" placeholder="Buscar por nome..." oninput="filterPicker()">
                </div>
                <div class="custom-select" style="width: 200px; margin-left: 10px;">
                    <select id="pickerRoleFilter" onchange="filterPicker()">
                        <option value="all">Todas as Funções</option>
                        <option value="otdd">Over Time DD</option>
                        <option value="bdd">Burst DD</option>
                        <option value="tank">Tanker</option>
                        <option value="sot">Support OT</option>
                    </select>
                    <i class="fa-solid fa-chevron-down select-icon"></i>
                </div>
            </div>

            <div class="modal-body" id="pickerGrid">
                <!-- Injetado via JS -->
            </div>

            <div class="separator-container">
                <div class="separator"></div>
            </div>

            <div class="modal-footer" style="padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: #080808;">
                <div id="selectedPokeInfo" style="display: flex; align-items: center; gap: 10px;">
                    <div style="width: 40px; height: 40px; background: #111; border: 1px solid #333; border-radius: 4px; display: flex; align-items: center; justify-content: center;">
                        <img id="selectedPokeImg" src="" style="width: 32px; height: 32px; display: none;">
                    </div>
                    <div style="display: flex; flex-direction: column;">
                        <span id="selectedPokeName" style="color: #eee; font-weight: 500;">Nenhum selecionado</span>
                        <div id="selectedPokeHelds" style="display: flex; gap: 4px; margin-top: 2px;"></div>
                    </div>
                </div>
                <button class="action-btn highlight-btn" id="confirmPokeBtn" onclick="confirmPokemonSelection()" disabled>Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Modal: Candidatura (Apply) -->
    <div class="modal-overlay" id="applyModal">
        <div class="modal-window">
            <div class="header">
                <div class="header-title">
                    <i class="fa-solid fa-paper-plane title-icon"></i>
                    <span>Solicitar Vaga</span>
                </div>
                <i class="fa-solid fa-xmark close-icon" onclick="closeApplyModal()"></i>
            </div>
            <div class="separator-container"><div class="separator"></div></div>
            <div class="modal-body" style="padding: 20px; display: flex; flex-direction: column; gap: 20px;">
                <div>
                    <label class="modal-section-label">Escolha sua Função</label>
                    <div id="applyRoleContainer" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <!-- Roles injetadas via JS -->
                    </div>
                </div>
                <div>
                    <label class="modal-section-label">Seu Pokémon</label>
                    <div class="role-row-poke-picker" id="applyPokePicker" onclick="openPickerModal(this)" style="padding: 12px; background: #080808;">
                        <img id="applyPokeIcon" src="assets/images_ui/pokeball_empty.png" style="width:30px;">
                        <div style="display: flex; flex-direction: column;">
                            <span id="applyPokeName" style="color: #eee; font-weight: 600;">Selecionar Pokémon...</span>
                            <div id="applyPokeHelds" style="display: flex; gap: 4px; margin-top: 4px;"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="separator-container"><div class="separator"></div></div>
            <div class="modal-footer" style="padding: 15px 20px; display: flex; justify-content: flex-end; gap: 10px;">
                <button class="action-btn btn-ghost" onclick="closeApplyModal()">Cancelar</button>
                <button class="action-btn highlight-btn" id="sendApplyBtn" onclick="submitApplication()" disabled>Enviar Solicitação</button>
            </div>
        </div>
    </div>

    <!-- Modal: Solicitações Pendentes (Applicants) -->
    <div class="modal-overlay" id="applicantsModal">
        <div class="modal-window" style="width: 900px; height: 650px; display: flex; flex-direction: column;">
            <div class="header">
                <div class="header-title">
                    <i class="fa-solid fa-users title-icon"></i>
                    <span>Solicitações Pendentes</span>
                </div>
                <i class="fa-solid fa-xmark close-icon" onclick="document.getElementById('applicantsModal').classList.remove('active')"></i>
            </div>
            <div class="separator-container"><div class="separator"></div></div>
            <div class="modal-body" style="background: #0b0b0b; padding: 20px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;">
                <!-- Exemplo de Player 1 -->
                <div class="applicant-row-premium">
                    <div class="arp-top" style="display: flex; gap: 20px; margin-bottom: 15px;">
                        <div style="flex: 1;"><label style="color:#555; font-size:0.7rem; text-transform:uppercase;">Função</label><div style="color:#eee; font-weight:600;">Damage</div></div>
                        <div style="flex: 1;"><label style="color:#555; font-size:0.7rem; text-transform:uppercase;">Pokémon</label><div style="color:#eee; font-weight:600;">Shiny Granbull</div></div>
                        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/210.png" style="width:40px; height:40px;">
                    </div>
                    <div class="arp-bottom" style="display: flex; justify-content: space-between; align-items: center;">
                        <div class="pdc-header" style="gap: 10px;">
                            <img src="assets/clans/ironhard.png" class="arp-clan-icon">
                            <img src="assets/icons/pve_burst_damage_dealer.png" style="width:24px;">
                            <div class="arp-name-bar">
                                <div style="color:#faba4d; font-weight:600;">Joasilva <span style="color:#666; font-size:0.8rem;">Lvl 580</span></div>
                                <div style="width: 150px; height: 4px; background: #222; border-radius: 2px; margin-top: 4px;"><div style="width: 85%; height: 100%; background: #3b82f6;"></div></div>
                            </div>
                        </div>
                        <div class="arp-actions" style="display: flex; gap: 15px;">
                            <i class="fa-solid fa-circle-check arp-icon-btn accept"></i>
                            <i class="fa-solid fa-circle-xmark arp-icon-btn decline"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Detalhes do Grupo -->
    <div class="modal-overlay" id="teamDetailsModal">
        <div class="modal-window" style="width: 800px; max-height: 85vh; display: flex; flex-direction: column;">
            <div class="header">
                <div class="header-title">
                    <i class="fa-solid fa-users-viewfinder title-icon"></i>
                    <span id="detailsTeamTitle">Detalhes do Grupo</span>
                </div>
                <i class="fa-solid fa-xmark close-icon" onclick="closeDetailsModal()"></i>
            </div>
            <div class="separator-container"><div class="separator"></div></div>
            <div class="modal-body" id="detailsContainer" style="padding: 20px; overflow-y: auto; background: #080808;">
                <!-- Injetado via JS -->
            </div>
        </div>
    </div>

    <script src="team_finder.js"></script>
</body>
</html>
